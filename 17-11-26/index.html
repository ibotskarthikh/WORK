<!DOCTYPE html>
<html>

<head>
    <title>CSS Display Property</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sticky"> Helooo, this is skitchyyy position</div>
    <h1>The Display Property</h1>

    <div class="imgbox" id="imgbox1">
        BOX1
        <img src="img1.png" alt="Image 1">
        <button onclick="removeElement()">Remove</button>
    </div>

    <div class="imgbox" id="imgbox2">
        BOX2
        <img src="img2.png" alt="Image 2">
        <button onclick="changeVisibility()">HIDE</button>
    </div>

    <div class="imgbox" id="imgbox3">
        BOX3
        <img src="img3.png" alt="Image 3">
        <button onclick="resetElement()">Reset</button>
    </div>

    <div class="clear"></div>

    <h2>display: inline:</h2>
    <div class="example ex2">
        <span>TEXT1</span>
        <span>TEXT2</span>
        <span>TEXT3</span>
    </div>

    <h2>display: block:</h2>
    <div class="example ex3">
        <span>TEXT1</span>
        <span>TEXT2</span>
        <span>TEXT3</span>
    </div>

    <h2>display: inline-block:</h2>
    <div class="example ex4">
        <span>TEXT1</span>
        <span>TEXT2</span>
        <span>TEXT3</span>
    </div>

    <h2>display: flex:</h2>
    <div class="example ex5">
        <span>TEXT1</span>
        <span>TEXT2</span>
        <span>TEXT3</span>
    </div>

    <h2>display: grid:</h2>
    <div class="example ex6">
        <span>TEXT1</span>
        <span>TEXT2</span>
        <span>TEXT3</span>
    </div>


    <h1> Z index</h1>
    <div class="container">
        <div class="black-box"> 1</div>
        <div class="gray-box"> 3</div>
        <div class="green-box"> 2</div>

        <script src="script.js">
        </script>
</body>

</html>

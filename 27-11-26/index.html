    <script>
        let textt;
        let day;
        let date = new Date().getDay();

        switch (date) {
            case 1:
                day = "monday ";
                break;
            case 2:
                day = "tuesday ";
                break;
            case 3:
                day = "wednesday ";
                break;
            case 4:
                day = "thursday ";
                break;
            case 5:
                day = "friday ";
                break;
            case 0:
            case 6:
                day = "WEEKEND ";
                break;
            default:
                day = "Heloooo ";
        }

        document.getElementById("demo1").innerHTML = "Today is " + day;
    </script>
